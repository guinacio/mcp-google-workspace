name: Fleet qualification

# W7a: the Redis-backed multi-replica path, qualified with a real Redis (TLS,
# ACL, AOF), two HTTP replicas and one task worker in separate containers
# built from the repository Dockerfile, behind nginx terminating TLS under a
# path prefix. Google is a test-only fake (deploy/fleet-test/fake_google).
# Every wait is a readiness/health poll with a deadline; each step and job is
# time-bounded.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    name: Fleet and container qualification (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
      FLEET_BASE_IMAGE: mcp-google-workspace:fleet-ci
      MCP_FLEET_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked test environment
        timeout-minutes: 5
        run: uv sync --frozen --all-groups

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the production image once
        timeout-minutes: 10
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.FLEET_BASE_IMAGE }}
          build-args: |
            MCP_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=fleet-amd64
          cache-to: type=gha,mode=max,scope=fleet-amd64

      - name: Container qualification
        timeout-minutes: 5
        run: uv run pytest -m fleet tests/test_container_image.py -v -rA

      # Brings the stack up cold (fresh throwaway secrets and volumes),
      # runs the suite through nginx over TLS, and tears it down.
      - name: Fleet qualification
        timeout-minutes: 15
        run: uv run pytest -m fleet tests/test_fleet_qualification.py -v -rA

      - name: Stack logs
        if: failure()
        run: cat deploy/fleet-test/.runtime/compose.log || true

      - name: Tear down
        if: always()
        timeout-minutes: 3
        run: uv run python deploy/fleet-test/fleet.py down

  arm64-build:
    # Build-only check that the image still builds for the second published
    # architecture (QEMU emulation; the push happens in release.yml).
    name: Build linux/arm64 (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build linux/arm64
        timeout-minutes: 35
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            MCP_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=fleet-arm64
          cache-to: type=gha,mode=max,scope=fleet-arm64
