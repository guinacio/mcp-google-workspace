name: Release container

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "src/**"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-container:
    name: Validate container image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mcp-google-workspace-ci:pr
          build-args: |
            MCP_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Smoke-test HTTP container
        shell: bash
        run: |
          set -euo pipefail
          image=mcp-google-workspace-ci:pr
          label() { docker image inspect --format "{{index .Config.Labels \"$1\"}}" "$image"; }
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "mcp"
          test "$(label io.modelcontextprotocol.server.name)" = "io.github.guinacio/mcp-google-workspace"
          test "$(label org.opencontainers.image.revision)" = "${{ github.sha }}"
          test -n "$(label org.opencontainers.image.source)"
          # Only the committed single-file UI build ships (no sources, tests or node tooling).
          test "$(docker run --rm --entrypoint ls "$image" /app/src/mcp_google_workspace/apps/ui)" = "dist"
          encryption_key="$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          docker run --detach --name mcp-google-workspace-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env MCP_HTTP_BASE_URL=http://127.0.0.1:8000 \
            --env MCP_HTTP_JWT_ISSUER=https://issuer.example.com \
            --env MCP_HTTP_JWT_AUDIENCE=google-workspace-mcp \
            --env MCP_HTTP_JWKS_URI=https://issuer.example.com/.well-known/jwks.json \
            --env MCP_GOOGLE_OAUTH_REDIRECT_URL=http://127.0.0.1:8000/google/oauth/callback \
            --env MCP_TOKEN_ENCRYPTION_KEY="$encryption_key" \
            "$image"
          trap 'docker logs mcp-google-workspace-smoke; docker rm --force mcp-google-workspace-smoke' EXIT
          # Bounded poll (30 x 1 s) instead of a fixed sleep.
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8000/health/live
          # One process, no Redis: not a fleet, so readiness is green (W5 policy).
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          test "$(curl --fail --silent http://127.0.0.1:8000/version | python -c 'import json,sys; print(json.load(sys.stdin)["commit"])')" = "${{ github.sha }}"
          # Unauthenticated modern request: 401 with the RFC 9728 challenge.
          status="$(curl --silent --output /dev/null --dump-header headers.txt --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2026-07-28' \
            --header 'Mcp-Method: tools/list' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            http://127.0.0.1:8000/mcp)"
          test "$status" = "401"
          grep -qi 'resource_metadata="http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp"' headers.txt
          # The test-only fake Google switch is refused by the production image.
          if docker run --rm --env MCP_FLEET_FAKE_GOOGLE=fleet-qualification-only "$image" 2>refused.txt; then
            exit 1
          fi
          grep -q "test-only setting" refused.txt

  publish-container:
    name: Build and publish container
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MCP_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
