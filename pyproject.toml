[project]
name = "mcp-google-workspace"
version = "1.0.0"
description = "Production MCP server for Gmail, Google Calendar, Keep, Drive and Chat"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Guilherme Inácio", email = "gsilvainacio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "boto3>=1.42.0",
    "cryptography>=50.0.0",
    "fastmcp[apps,tasks]>=4.0.10,<5",
    "fastmcp-tasks>=4.0.10,<5",
    "google-genai>=1.67.0",
    "google-api-python-client>=2.190.0",
    "google-auth>=2.48.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.3.0",
    "httplib2>=0.32.0",
    "mcp>=2.2.0,<3",
    "mcp-types>=2.2.0,<3",
    "opentelemetry-api>=1.39.1",
    "prometheus-client>=0.25.0",
    "pydantic[email]>=2.12.5",
    "idna>=3.15",
    "keyring>=25.7.0",
    "pyasn1>=0.6.3",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.1",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
]

[project.scripts]
mcp-google-workspace = "mcp_google_workspace.bundle_entry:main"
mcp-google-workspace-http = "mcp_google_workspace.server_http:main"
mcp-google-workspace-worker = "mcp_google_workspace.task_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "burner-redis>=0.1.7",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "ruff>=0.15.4",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
