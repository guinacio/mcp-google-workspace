  --md-sys-color-on-surface-variant: var(--color-text-secondary, #5f6368);

}

button,
input,
textarea,
select {
  font: inherit;
}

.dashboard {
  max-width: 1400px;
  margin: 0 auto;
  padding: 18px 16px 32px;
  display: grid;
  gap: 18px;
}

/* ── Top bar ─────────────────────────────────────────────────────────── */
.top-bar {
  background: var(--workspace-header);
  border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 82%, transparent);
  border-radius: var(--radius-lg);
  box-shadow: var(--md-sys-elevation-1);
  padding: 15px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.top-brand {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 12px;
}

.workspace-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(135deg, #4285f4 0%, #1a73e8 100%);
  color: #fff;
  box-shadow: 0 3px 7px color-mix(in srgb, #1a73e8 30%, transparent);
  font-size: 1.02rem;
  font-weight: 700;
}

.top-bar h1 {
  margin: 0;
  font-size: 1.08rem;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.top-eyebrow,
.calendar-kicker {
  color: var(--md-sys-color-on-surface-variant);
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.top-sub {
  color: var(--md-sys-color-on-surface-variant);
  font-size: 0.76rem;
  margin-top: 1px;
}

.quick-stats {
  display: inline-flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.stat-chip {
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 85%, transparent);
  background: var(--md-sys-color-surface-container-high);
  color: var(--md-sys-color-on-surface-variant);
  padding: 6px 10px;
  font-size: 0.72rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.stat-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--md-sys-color-primary);
}

.stat-chip-mail .stat-dot {
  background: #34a853;
}

/* ── Two-column layout ───────────────────────────────────────────────── */
.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 68fr) minmax(320px, 32fr);
  gap: 18px;
}

.main-grid-full {
  grid-template-columns: 1fr;
}

.surface {
  background: var(--md-sys-color-surface-container);
  border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 85%, transparent);
  border-radius: var(--radius-lg);
  box-shadow: var(--md-sys-elevation-1);
}

.calendar-shell {
  overflow: hidden;
  padding: 0;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px 16px;
  overflow-x: auto;
}

.calendar-heading {
  min-width: max-content;
}

.calendar-title-line {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 2px 0;
}

.calendar-title-line h2 {
  margin: 0;
  color: var(--md-sys-color-on-surface);
  font-size: 1.12rem;
  font-weight: 500;
  letter-spacing: -0.016em;
}

.calendar-count {
  border-radius: 999px;
  background: var(--workspace-tint);
  color: var(--md-sys-color-primary);
  font-size: 0.69rem;
  font-weight: 700;
  padding: 3px 7px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 11px;
  gap: 10px;
}

.section-title {
  color: var(--md-sys-color-on-surface);
  font-size: 0.98rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.section-subtitle {
  color: var(--md-sys-color-on-surface-variant);
  font-size: 0.73rem;
}

/* ── Navigation / chip buttons ───────────────────────────────────────── */
.week-nav {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px;
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: 999px;
}

.calendar-actions {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  flex-wrap: wrap;
}

.calendar-select {
  position: relative;
}

.calendar-select summary {
  list-style: none;
}

.calendar-select summary::-webkit-details-marker {
  display: none;
}

.calendar-select-list {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 260px;
  max-height: 260px;
  overflow: auto;
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--radius-sm);
  background: var(--md-sys-color-surface-container-high);
  box-shadow: var(--md-sys-elevation-2);
  padding: 8px;
  z-index: 30;
  display: grid;
  gap: 6px;
}

.calendar-option {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  font-size: 0.76rem;
  color: var(--md-sys-color-on-surface);
}

.calendar-option small {
  color: var(--md-sys-color-outline);
  font-size: 0.68rem;
}

.nav-btn,
.chip-btn,
.action-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--md-sys-color-on-surface-variant);
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 0.73rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.nav-btn:hover,
.chip-btn:hover,
.action-btn:hover {
  background: var(--workspace-tint);
  border-color: transparent;
  color: var(--md-sys-color-primary);
}

.nav-icon {
  width: 30px;
  height: 30px;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 1.3rem;
  line-height: 1;
}

.nav-today {
  padding-inline: 9px;
}

.create-event-btn {
  background: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  box-shadow: 0 1px 2px color-mix(in srgb, var(--md-sys-color-primary) 35%, transparent);
}

.create-event-btn:hover {
  background: color-mix(in srgb, var(--md-sys-color-primary) 88%, #000);
  color: var(--md-sys-color-on-primary);
}

/* ── Weekly calendar grid ────────────────────────────────────────────── */
.week-grid {
  display: grid;
  grid-template-columns: repeat(var(--day-count, 7), minmax(150px, 1fr));
  gap: 0;
  position: relative;
  isolation: isolate;
  overflow-x: auto;
  border-top: 1px solid var(--md-sys-color-outline-variant);
  padding-bottom: 0;
  scrollbar-gutter: stable both-edges;
}

.day-col {
  background: var(--md-sys-color-surface-container);
  border: 0;
  border-right: 1px solid var(--md-sys-color-outline-variant);
  padding: 12px 10px;
  min-height: 470px;
  overflow: visible;
  position: relative;
  z-index: 1;
}

.day-col:last-child {
  border-right: 0;
}

.day-col:hover {
  z-index: 15;
}

.day-col.today {
  background: color-mix(in srgb, var(--md-sys-color-primary) 3%, var(--md-sys-color-surface-container));
}

.day-head {
  min-height: 42px;
  margin-bottom: 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
}

.day-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.day-label-name {
  color: var(--md-sys-color-on-surface-variant);
  font-size: 0.69rem;
  font-weight: 700;
  letter-spacing: 0.065em;
  text-transform: uppercase;
}

.day-label-number {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--md-sys-color-on-surface);
  font-size: 0.96rem;
  font-weight: 500;
}

.day-col.today .day-label-name {
  color: var(--md-sys-color-primary);
}

.day-col.today .day-label-number {
  background: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
}

.day-all-day {
  display: grid;
  gap: 5px;
  margin-bottom: 10px;
}

.all-day-chip {
  font-size: 0.7rem;
  border-radius: 6px;
  padding: 4px 7px;
  background: var(--workspace-tint);
  color: var(--md-sys-color-primary);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
}

.day-events {
  display: grid;
  gap: 7px;
  overflow: visible;
}

.day-empty {
  color: var(--md-sys-color-outline);
  font-size: 0.7rem;
  padding: 12px 2px;
}

/* ── Event card ──────────────────────────────────────────────────────── */
.calendar-event {
  border-radius: 7px;
  border-left: 4px solid var(--event-color);
  background: color-mix(in srgb, var(--event-color) 16%, var(--md-sys-color-surface-container));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--event-color) 22%, transparent);

  z-index: 1;
  transition: background 0.15s;
}

.calendar-event:hover {
  background: color-mix(in srgb, var(--event-color) 26%, var(--md-sys-color-surface-container));

  z-index: 120;
}

.event-time {
  font-size: 0.68rem;

  letter-spacing: 0.01em;
}

.event-title {
  font-size: 0.76rem;
  font-weight: 600;
  margin-top: 2px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.event-meta {
  margin-top: 3px;
  color: var(--md-sys-color-on-surface-variant);
  font-size: 0.68rem;
}

/* ── Event hover tooltip ─────────────────────────────────────────────── */
.event-hover {
  display: none !important;
}

.event-tooltip-layer {
  position: fixed;
  z-index: 2147483000;
  min-width: 238px;
  max-width: 340px;
  border-radius: 12px;
  border: 1px solid var(--md-sys-color-outline-variant);
  background: var(--md-sys-color-surface);
  box-shadow: 0 6px 18px color-mix(in srgb, #000 24%, transparent), var(--md-sys-elevation-2);
  overflow: hidden;
  font-size: 0.74rem;
  line-height: 1.45;
  color: var(--md-sys-color-on-surface);
  word-break: break-word;
  max-height: 220px;
  overflow-y: auto;
  pointer-events: none;
}

.event-tooltip-head {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 11px 12px 7px;
}

.event-tooltip-color {
  width: 9px;
  height: 9px;
  margin-top: 4px;
  border-radius: 50%;
  flex: 0 0 auto;
  background: var(--tooltip-color, var(--md-sys-color-primary));
}

.event-tooltip-title {
  color: var(--md-sys-color-on-surface);
  font-size: 0.82rem;
  font-weight: 650;
  line-height: 1.3;
}

.event-tooltip-content {
  display: grid;
  gap: 5px;
  padding: 1px 12px 10px 29px;
  color: var(--md-sys-color-on-surface-variant);
}

.event-tooltip-description {
  margin-top: 3px;
  padding-top: 8px;
  border-top: 1px solid var(--md-sys-color-outline-variant);
  color: var(--md-sys-color-on-surface);
}

.event-tooltip-foot {
  padding: 7px 12px;
  border-top: 1px solid var(--md-sys-color-outline-variant);
  background: var(--md-sys-color-surface-container);
  color: var(--md-sys-color-primary);
  font-size: 0.7rem;
  font-weight: 600;
}

/* ── Event inline actions (shown on hover) ───────────────────────────── */
.event-actions {
  margin-top: 4px;
  display: none;
  flex-wrap: wrap;
  gap: 3px;
}

.calendar-event:hover .event-actions {
  display: flex;
}

.rsvp-chip {
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: 999px;
  background: transparent;
  font-size: 0.68rem;
  padding: 2px 7px;
  cursor: pointer;
  color: var(--md-sys-color-on-surface-variant);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.rsvp-chip:hover {
  border-color: var(--md-sys-color-primary);
  color: var(--md-sys-color-primary);
}

.rsvp-chip.active {
  background: var(--md-sys-color-primary);
  border-color: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
}

/* ── Sidebar ─────────────────────────────────────────────────────────── */
.sidebar {
  display: grid;
  gap: 16px;
  align-content: start;
}

.inbox-shell {
  overflow: hidden;
  padding: 16px 0 0;
  border-radius: var(--radius-lg);
}

.inbox-shell .section-head {
  margin: 0;
  padding: 0 16px 12px;
}

/* ── Inbox ────────────────────────────────────────────────────────────── */
.inbox-list {
  display: grid;
  gap: 0;
  max-height: 460px;
  overflow: auto;
  border-top: 1px solid var(--md-sys-color-outline-variant);
}

.inbox-row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  min-height: 61px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.12s, box-shadow 0.12s;
}

.inbox-row:hover {
  background: color-mix(in srgb, var(--md-sys-color-primary) 8%, var(--md-sys-color-surface-container-high));
  box-shadow: inset 2px 0 0 var(--md-sys-color-primary);
}

.inbox-row.unread {

}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;

  color: var(--md-sys-color-primary);

  place-items: center;
  font-size: 0.72rem;
  font-weight: 700;
}

.mail-avatar {
  background: color-mix(in srgb, var(--md-sys-color-primary) 20%, var(--md-sys-color-surface-container-highest));
}

.mail-content {
  min-width: 0;
}

.mail-from {
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--md-sys-color-on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mail-subject {
  margin-top: 1px;
  font-size: 0.72rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--md-sys-color-on-surface);
}

.mail-subject.unread {
  font-weight: 650;
  color: var(--md-sys-color-on-surface);
}

.mail-subject span {
  color: var(--md-sys-color-on-surface-variant);
  font-weight: 400;
}

.inbox-title span {
  margin-left: 6px;
  color: var(--md-sys-color-on-primary-container);
  background: var(--md-sys-color-primary-container);
  border-radius: 999px;
  padding: 3px 7px;
  font-size: 0.66rem;
  font-weight: 600;
}

.mail-date {
  align-self: start;
  color: var(--md-sys-color-on-surface-variant);
  font-size: 0.67rem;
  font-weight: 600;
  padding-left: 5px;
  white-space: nowrap;
}

/* ── Overlay panels (event detail / email detail) ────────────────────── */
.overlay {
  position: fixed;

  place-items: center;
  padding: 20px;
  z-index: 50;
}

.panel {

}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.panel-title {

}

.panel-sub {

}

.event-editor-form {

.editor-field {

}

.editor-field textarea {

}

.editor-actions {

}

.inline-toggle {

.banner {

.attendee-list {

.attachment-list {

.attachment-link {

}

.attachment-link:hover {
  text-decoration: underline;
}

.email-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.email-panel {
  width: min(920px, 96vw);
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--md-sys-color-surface);
}

.event-panel {

.event-toolbar {

  color: var(--md-sys-color-on-surface-variant);

.event-panel-body {

.event-subject-line h2 {

.event-when {

.event-command-bar {

.event-info-list {

.event-info-row {

.event-info-icon {

.event-info-label {
  display: block;
  margin-bottom: 2px;

.event-description {
  white-space: pre-wrap;
  word-break: break-word;
}

.event-attendee-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 8px;
}

.event-attendee {

}

.event-attendee-avatar {

.event-attendee-name {

.event-attendee-status {

.event-attachments {

.email-panel-body {

.email-toolbar {
  min-height: 54px;

  background: var(--md-sys-color-surface-container);

.email-toolbar .nav-btn {

.email-back {
  width: 34px;
  height: 34px;
  border: 0;

.email-back:hover {

.email-subject-line {

.email-subject-line h2 {

.email-sender-row {

.email-sender-identities span,

.email-attachments {

.email-attachments .attachment-list {

.gmail-message-surface {

.email-footer-actions {

}

.email-chip {
  border: 1px solid var(--md-sys-color-outline-variant);

  transition: background 0.15s, color 0.15s, border-color 0.15s;

.email-chip:hover {

.email-chip.active {

.email-statuses {

.email-meta-grid {

.email-body-block {

.email-body-header {

.email-body-content h2,
.email-body-content h3,

  height: auto;
  margin: 0.5rem 0;
  border-radius: var(--radius-sm);
}

.email-image-blocked {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.35rem 0.6rem;
  border-radius: 999px;
  border: 1px solid var(--md-sys-color-outline-variant);
  color: var(--md-sys-color-on-surface-variant);
  background: color-mix(in srgb, var(--md-sys-color-surface-container-highest) 68%, transparent);
  font-size: 0.72rem;
}

.email-body-content a {
  color: var(--md-sys-color-primary);
  text-decoration: underline;
  text-underline-offset: 0.18em;
  cursor: pointer;
}

.email-body-content a:hover {
  color: color-mix(in srgb, var(--md-sys-color-primary) 78%, white);
}

.email-body-empty {
  color: var(--md-sys-color-on-surface-variant);
}
.status-chip {
  border-radius: 999px;
  border: 1px solid var(--md-sys-color-outline-variant);
  padding: 2px 8px;
  font-size: 0.68rem;
  color: var(--md-sys-color-on-surface-variant);
}

/* ── Loading state ───────────────────────────────────────────────────── */
.loading-state {
  min-height: 280px;
  display: grid;
  place-items: center;
  color: var(--md-sys-color-on-surface-variant);
  font-size: 0.85rem;
}

/* ── Responsive ──────────────────────────────────────────────────────── */
@media (max-width: 1120px) {
  .main-grid {
    grid-template-columns: 1fr;
  }

  .week-grid {
    grid-template-columns: repeat(var(--day-count, 7), minmax(140px, 1fr));
  }

  .day-col {
    min-height: 320px;
  }
}

@media (max-width: 760px) {
  .dashboard {
    padding: 10px 8px 20px;
    gap: 12px;
  }

  .top-bar {
    align-items: flex-start;
    flex-direction: column;
    padding: 14px;
  }

  .quick-stats {
    justify-content: flex-start;
  }

  .calendar-header {
    align-items: flex-start;
    flex-direction: column;
    padding: 16px 14px 14px;
  }

  .calendar-actions {
    justify-content: flex-start;
  }

  .calendar-title-line h2 {
    font-size: 1rem;
  }

  .week-grid {
    grid-template-columns: repeat(var(--day-count, 7), minmax(128px, 1fr));
  }

  .day-col {
    min-height: 380px;
    padding: 10px 8px;
  }

  .inbox-row {
    grid-template-columns: 30px minmax(0, 1fr) auto;
    min-height: 56px;
    padding: 9px 10px;
  }

  .avatar {
    width: 30px;
    height: 30px;
  }

  .email-panel {
    width: 100%;
    max-height: 100vh;
    border-radius: 0;
  }

  .email-panel-body {
    padding: 18px;
  }

  .email-subject-line {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
  }

  .email-sender-row {
    grid-template-columns: 38px minmax(0, 1fr);
    align-items: start;
  }

  .email-sender-avatar {
    width: 38px;
    height: 38px;
  }

  .email-sender-row time {
    grid-column: 2;
    text-align: left;
  }

  .email-footer-actions {
    justify-content: flex-start;
  }

  .editor-row {
    grid-template-columns: 1fr;
  }
}
