# Fleet qualification Redis: TLS only, ACL users, AOF persistence, no eviction.
# The production recommendations in docs/DEPLOYMENT_FLEET.md match these.
port 0
tls-port 6379
tls-cert-file /tls/server.crt
tls-key-file /tls/server.key
tls-ca-cert-file /tls/ca.pem
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"

aclfile /usr/local/etc/redis/users.acl
protected-mode yes

dir /data
appendonly yes
appendfsync everysec
# RDB snapshots stay enabled alongside AOF (Redis defaults).

# Application state, operation records, uploads metadata, OAuth state and the
# task queue must never be evicted silently.
maxmemory 256mb
maxmemory-policy noeviction
