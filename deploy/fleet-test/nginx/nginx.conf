# Fleet qualification reverse proxy (TLS termination, path prefix /gw).
#
# Production-relevant parts are marked PROD; parts marked TEST-ONLY exist so
# the qualification suite can observe routing and must not be copied into a
# real deployment. docs/DEPLOYMENT_FLEET.md has the production template.

# TEST-ONLY: one worker process keeps a single round-robin cursor, so
# consecutive requests alternate deterministically between the replicas.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    log_format fleet '$remote_addr "$request" $status upstream=$upstream_addr '
                     'rt=$request_time urt=$upstream_response_time '
                     'mcp_version=$http_mcp_protocol_version session=$http_mcp_session_id';
    access_log /dev/stdout fleet;

    # PROD: re-resolve replica names (Docker DNS) so a restarted replica with
    # a new address is picked up; requires the upstream "zone" and "resolve".
    resolver 127.0.0.11 valid=2s ipv6=off;

    # PROD: modern (2026-07-28) requests always carry this header and need no
    # affinity. Anything else is handshake-era (legacy) traffic, whose
    # Mcp-Session-Id lives in one process.
    map $http_mcp_protocol_version $mcp_pool {
        "2026-07-28" mcp_modern;
        default      mcp_legacy;
    }

    upstream mcp_modern {
        zone mcp_modern 64k;
        server replica-1:8000 resolve max_fails=1 fail_timeout=2s;
        server replica-2:8000 resolve max_fails=1 fail_timeout=2s;
        keepalive 16;
    }

    # PROD (only if legacy clients are served): session affinity for legacy
    # traffic. The initialize request carries no Mcp-Session-Id yet, so hashing
    # on that header cannot pin a session to the replica that created it; hash
    # on the client address instead (use a trusted X-Forwarded-For via
    # realip when another load balancer sits in front).
    upstream mcp_legacy {
        zone mcp_legacy 64k;
        hash $binary_remote_addr consistent;
        server replica-1:8000 resolve max_fails=1 fail_timeout=2s;
        server replica-2:8000 resolve max_fails=1 fail_timeout=2s;
        keepalive 16;
    }

    # PROD: streaming and timeouts.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;            # request-scoped SSE (progress) flows immediately
    proxy_cache off;
    proxy_request_buffering off;    # the app's streaming limiter sees chunked bodies as they arrive
    proxy_connect_timeout 2s;
    proxy_send_timeout 700s;
    proxy_read_timeout 700s;        # above MCP_EXPENSIVE_DEADLINE_SECONDS (600)
    # Retry another replica only when the request never reached one (connect
    # error). POST is not retried after it was sent: tool calls are not
    # idempotent. Never add "non_idempotent" here.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    # Above the app's MCP_MAX_REQUEST_BYTES (1 MiB in this stack), so the app
    # answers oversized bodies first; nginx's own limit is the outer bound.
    client_max_body_size 2m;

    # TEST-ONLY: expose which replica served the request.
    add_header X-Fleet-Upstream $upstream_addr always;

    server {
        listen 443 ssl default_server;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # PROD: the MCP endpoint under the public prefix.
        location = /gw/mcp {
            proxy_pass http://$mcp_pool/mcp;
        }

        # PROD: health, version, metrics policy and the Google OAuth callback.
        location /gw/ {
            proxy_pass http://mcp_modern/;
        }

        # PROD: RFC 9728 metadata stays at the host root with the prefixed
        # resource path appended (MCP_HTTP_BASE_URL=https://host/gw).
        location /.well-known/oauth-protected-resource/gw/ {
            proxy_pass http://mcp_modern;
        }

        # TEST-ONLY: round robin for every protocol version, no affinity (shows
        # what happens to a legacy session without it).
        location = /rr/mcp {
            proxy_pass http://mcp_modern/mcp;
        }

        # TEST-ONLY: address one container directly (readiness per replica,
        # requests pinned to a replica, the misconfigured negative replica).
        location ~ ^/_fleet/(replica-1|replica-2|replica-nokeys|replica-notaskkey)(/.*)$ {
            set $fleet_target $1;
            proxy_pass http://$fleet_target:8000$2;
        }

        location / {
            return 404;
        }
    }

    # TEST-ONLY: the throwaway issuer's JWKS (issuer.fleet.test on the internal
    # network). Tokens are minted by the suite with the matching private key.
    server {
        listen 443 ssl;
        server_name issuer.fleet.test;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        root /srv/issuer;

        location = /jwks.json {
            default_type application/json;
        }

        location / {
            return 404;
        }
    }
}
